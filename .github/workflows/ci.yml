name: CI Pipeline

on:
  push: { branches: [main, develop, feature/**] }
  pull_request: { branches: [main] }

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [employee-service, payroll-service, attendance-service, notification-service, auth-service, gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - run: cd ${{ matrix.service }} && mvn clean package -DskipTests
      - run: cd ${{ matrix.service }} && mvn test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - run: cd hr-portal && npm ci && npm run build
